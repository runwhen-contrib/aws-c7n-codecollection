apiVersion: runwhen.com/v1
kind: Runbook
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
spec:
  location: {{default_location}}
  description: Check for EC2 instances that are stale or stopped.
  codeBundle:
    {% if repo_url %}
    repoUrl: {{repo_url}}
    {% else %}
    repoUrl: https://github.com/runwhen-contrib/aws-c7n-codecollection.git
    {% endif %}
    {% if ref %}
    ref: {{ref}}
    {% else %}
    ref: main
    {% endif %}
    pathToRobot: codebundles/aws-c7n-ec2-health/runbook.robot
  configProvided:
    - name: AWS_REGION
      value: "{{match_resource.resource.region}}"
    - name: AWS_ACCOUNT_ID
      value: "{{match_resource.resource.account_id}}"
    - name: AWS_ACCOUNT_NAME
      value: "{{match_resource.account_name}}"
    - name: AWS_EC2_AGE
      value: '60'
    - name: AWS_EC2_TAGS
      value: ''
    - name: MAX_ALLOWED_STOPPED_INSTANCES
      value: '0'
    - name: MAX_ALLOWED_STALE_INSTANCES
      value: '0'
  secretsProvided:
    {% include "aws-auth.yaml" ignore missing %}
